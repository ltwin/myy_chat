# Pre-commit hooks configuration for MyY Chat
# 确保代码质量和一致性

repos:
  # Golang 相关钩子
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        name: Go Format
        description: 格式化 Go 代码
      - id: go-vet
        name: Go Vet
        description: Go 静态分析
      - id: go-imports
        name: Go Imports
        description: 整理 Go 导入
      - id: go-mod-tidy
        name: Go Mod Tidy
        description: 清理 go.mod
      - id: golangci-lint
        name: GolangCI Lint
        description: 运行 golangci-lint
        args: ['--fast']

  # Python 相关钩子
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        name: Ruff Linter
        description: Python 代码检查
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff Format
        description: Python 代码格式化

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        name: MyPy Type Check
        description: Python 类型检查
        additional_dependencies:
          - types-redis
          - types-requests
        args: [--ignore-missing-imports]
        exclude: ^backend/python/.*_pb2\.py$|^backend/python/.*_pb2_grpc\.py$

  # 通用钩子
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        description: 删除行尾空格
      - id: end-of-file-fixer
        name: Fix End of Files
        description: 确保文件以换行符结尾
      - id: check-yaml
        name: Check YAML
        description: 验证 YAML 文件
        args: ['--unsafe']
      - id: check-added-large-files
        name: Check Large Files
        description: 防止提交大文件
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check Merge Conflicts
        description: 检查合并冲突标记
      - id: check-case-conflict
        name: Check Case Conflict
        description: 检查文件名大小写冲突
      - id: mixed-line-ending
        name: Mixed Line Ending
        description: 统一行尾符号
        args: ['--fix=lf']
      - id: detect-private-key
        name: Detect Private Key
        description: 检测私钥泄露

  # Frontend 相关钩子
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.18.0
    hooks:
      - id: eslint
        name: ESLint
        description: JavaScript/TypeScript 代码检查
        files: \.(js|jsx|ts|tsx)$
        types: [file]
        args: ['--fix', '--max-warnings=0']
        additional_dependencies:
          - eslint@9.18.0
          - '@typescript-eslint/parser@8.19.1'
          - '@typescript-eslint/eslint-plugin@8.19.1'
          - eslint-config-next@15.1.4

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Prettier
        description: 代码格式化
        args: ['--write']
        files: \.(js|jsx|ts|tsx|json|css|scss|md)$

  # 提交信息检查
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.2.1
    hooks:
      - id: commitizen
        name: Commitizen Check
        description: 检查提交信息格式
        stages: [commit-msg]

# 配置选项
default_language_version:
  python: python3.11
  node: '20.11.0'

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
