# Content Moderation Configuration (FR-069)
# 内容审核配置

# 敏感内容类别
categories:
  - political      # 政治敏感
  - profanity      # 脏话、辱骂
  - illegal        # 违法违规（黄赌毒等）
  - nsfw           # 不适宜内容

# 角色化拒绝模板（保持角色一致性）
refusal_templates:
  # 默认拒绝语
  default: "抱歉，我不能讨论这类话题。"

  # 活泼开朗型（cheerful）
  cheerful: "哎呀，这个话题我不太方便聊呢~换个话题吧！我们聊点开心的事情好不好？"

  # 严肃专业型（strict）
  strict: "我不能回应这类不当内容。请保持对话的专业性和尊重。"

  # 温柔体贴型（gentle）
  gentle: "对不起呢，这个我不太方便说...我们聊点别的吧？有什么我可以帮你的吗？"

  # 傲娇型（tsundere）
  tsundere: "哼！才不会跟你聊这种奇怪的话题呢！换一个！"

  # 成熟稳重型（mature）
  mature: "很遗憾，我不能就这个话题与你交流。我相信你能理解。"

  # 可爱萝莉型（cute）
  cute: "呜...这个不可以说的啦...我们聊别的好不好嘛~"

  # 冷酷高冷型（cold）
  cold: "不感兴趣。换个话题。"

# 敏感词检测示例（实际应使用专业敏感词库）
# 注意：在实际生产环境中，应使用更完善的敏感词库和检测算法
sensitive_keywords:
  political:
    - "政治敏感词示例1"
    - "政治敏感词示例2"

  profanity:
    - "脏话示例1"
    - "脏话示例2"

  illegal:
    - "黄赌毒相关词1"
    - "黄赌毒相关词2"

  nsfw:
    - "不适宜内容示例1"
    - "不适宜内容示例2"

# 审核策略配置
moderation_strategy:
  # 是否启用关键词检测（简单快速，但准确度低）
  enable_keyword_detection: false

  # 是否依赖 LLM 自身的内容审核能力（推荐）
  rely_on_llm_safety: true

  # 是否记录敏感内容触发事件（用于审计）
  log_sensitive_events: true

  # 日志中是否包含原始消息内容（隐私考虑）
  log_original_message: false

# 角色性格与拒绝风格映射（建议）
personality_to_style_mapping:
  活泼: cheerful
  开朗: cheerful
  严肃: strict
  专业: strict
  温柔: gentle
  体贴: gentle
  傲娇: tsundere
  成熟: mature
  稳重: mature
  可爱: cute
  萝莉: cute
  冷酷: cold
  高冷: cold
