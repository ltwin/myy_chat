syntax = "proto3";

package mcp.v1;

option go_package = "github.com/myy-chat/backend/api/mcp/v1;v1";
option java_multiple_files = true;
option java_package = "mcp.v1";

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

// MCPService exposes scoped tool discovery and execution for agent callers.
service MCPService {
  // ListTools returns tools visible to the caller scope.
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse) {
    option (google.api.http) = {
      get: "/api/v1/mcp/tools"
    };
  }

  // CallTool executes a registered tool by name.
  rpc CallTool(CallToolRequest) returns (CallToolResponse) {
    option (google.api.http) = {
      post: "/api/v1/mcp/tools/{tool_name}:call"
      body: "*"
    };
  }
}

message ListToolsRequest {
  repeated string scopes = 1;
}

message ToolInfo {
  string name = 1;
  string domain = 2;
  string description = 3;
  repeated string required_scopes = 4;
}

message ListToolsResponse {
  repeated ToolInfo tools = 1;
}

message CallToolRequest {
  string tool_name = 1;
  google.protobuf.Struct args = 2;
  string idempotency_key = 3;
}

message ToolError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message CallToolResponse {
  google.protobuf.Struct result = 1;
  ToolError error = 2;
}
