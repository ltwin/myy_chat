syntax = "proto3";

package admin.v1;

option go_package = "github.com/myy-chat/backend/api/admin/v1;v1";
option java_multiple_files = true;
option java_package = "admin.v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// AdminService 管理后台服务
service AdminService {
  // ListUsers 获取用户列表
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/users"
    };
  }

  // GetUserDetail 获取用户详情
  rpc GetUserDetail(GetUserDetailRequest) returns (GetUserDetailResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/users/{user_id}"
    };
  }

  // BanUser 封禁用户
  rpc BanUser(BanUserRequest) returns (BanUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/users/{user_id}/ban"
      body: "*"
    };
  }

  // UnbanUser 解封用户
  rpc UnbanUser(UnbanUserRequest) returns (UnbanUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/users/{user_id}/unban"
      body: "*"
    };
  }

  // ListCharacters 获取角色列表(管理视角)
  rpc ListCharacters(ListCharactersRequest) returns (ListCharactersResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/characters"
    };
  }

  // ApproveCharacter 审核角色
  rpc ApproveCharacter(ApproveCharacterRequest) returns (ApproveCharacterResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/characters/{character_id}/approve"
      body: "*"
    };
  }

  // GetSystemStats 获取系统统计
  rpc GetSystemStats(GetSystemStatsRequest) returns (GetSystemStatsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/stats"
    };
  }

  // HealthCheck 健康检查
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get: "/health"
    };
  }

  // ============================================
  // 积分管理接口 (T231)
  // ============================================

  // GetCreditFormula 获取积分转换公式配置
  rpc GetCreditFormula(GetCreditFormulaRequest) returns (GetCreditFormulaResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/billing/formula"
    };
  }

  // UpdateCreditFormula 更新积分转换公式
  rpc UpdateCreditFormula(UpdateCreditFormulaRequest) returns (UpdateCreditFormulaResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/billing/formula"
      body: "*"
    };
  }

  // ListAdminCreditPackages 获取积分套餐列表 (管理视角)
  rpc ListAdminCreditPackages(ListAdminCreditPackagesRequest) returns (ListAdminCreditPackagesResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/billing/packages"
    };
  }

  // CreateCreditPackage 创建积分套餐
  rpc CreateCreditPackage(CreateCreditPackageRequest) returns (CreateCreditPackageResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/billing/packages"
      body: "*"
    };
  }

  // UpdateCreditPackage 更新积分套餐
  rpc UpdateCreditPackage(UpdateCreditPackageRequest) returns (UpdateCreditPackageResponse) {
    option (google.api.http) = {
      put: "/api/v1/admin/billing/packages/{package_id}"
      body: "*"
    };
  }

  // DeleteCreditPackage 删除积分套餐
  rpc DeleteCreditPackage(DeleteCreditPackageRequest) returns (DeleteCreditPackageResponse) {
    option (google.api.http) = {
      delete: "/api/v1/admin/billing/packages/{package_id}"
    };
  }

  // AdjustUserCredits 调整用户积分 (管理员手动操作)
  rpc AdjustUserCredits(AdjustUserCreditsRequest) returns (AdjustUserCreditsResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/users/{user_id}/credits"
      body: "*"
    };
  }

  // GetBillingStats 获取计费统计
  rpc GetBillingStats(GetBillingStatsRequest) returns (GetBillingStatsResponse) {
    option (google.api.http) = {
      get: "/api/v1/admin/billing/stats"
    };
  }
}

// ListUsersRequest 获取用户列表请求
message ListUsersRequest {
  int32 page = 1;           // 页码
  int32 page_size = 2;      // 每页数量
  string search = 3;        // 搜索关键词
  string status = 4;        // 状态筛选: "active", "banned", "deleted"
  string sort_by = 5;       // 排序字段
  bool sort_desc = 6;       // 是否降序
}

// ListUsersResponse 获取用户列表响应
message ListUsersResponse {
  repeated AdminUser users = 1;  // 用户列表
  int32 total = 2;               // 总数
  int32 page = 3;                // 当前页
  int32 page_size = 4;           // 每页数量
}

// GetUserDetailRequest 获取用户详情请求
message GetUserDetailRequest {
  int64 user_id = 1;  // 用户ID
}

// GetUserDetailResponse 获取用户详情响应
message GetUserDetailResponse {
  AdminUser user = 1;             // 用户信息
  int64 total_conversations = 2;  // 总对话数
  int64 total_messages = 3;       // 总消息数
  int64 credit_balance = 4;       // 积分余额
}

// BanUserRequest 封禁用户请求
message BanUserRequest {
  int64 user_id = 1;     // 用户ID
  string reason = 2;     // 封禁原因
  int32 duration = 3;    // 封禁时长(天)，0表示永久
}

// BanUserResponse 封禁用户响应
message BanUserResponse {
  bool success = 1;                           // 是否成功
  google.protobuf.Timestamp banned_until = 2; // 封禁截止时间
}

// UnbanUserRequest 解封用户请求
message UnbanUserRequest {
  int64 user_id = 1;  // 用户ID
}

// UnbanUserResponse 解封用户响应
message UnbanUserResponse {
  bool success = 1;  // 是否成功
}

// ListCharactersRequest 获取角色列表请求
message ListCharactersRequest {
  int32 page = 1;           // 页码
  int32 page_size = 2;      // 每页数量
  string status = 3;        // 状态: "pending", "approved", "rejected"
  bool only_official = 4;   // 仅官方角色
}

// ListCharactersResponse 获取角色列表响应
message ListCharactersResponse {
  repeated AdminCharacter characters = 1;  // 角色列表
  int32 total = 2;                         // 总数
}

// ApproveCharacterRequest 审核角色请求
message ApproveCharacterRequest {
  int64 character_id = 1;  // 角色ID
  bool approved = 2;       // 是否通过
  string reason = 3;       // 审核意见
}

// ApproveCharacterResponse 审核角色响应
message ApproveCharacterResponse {
  bool success = 1;  // 是否成功
}

// GetSystemStatsRequest 获取系统统计请求
message GetSystemStatsRequest {
  string period = 1;  // 统计周期: "day", "week", "month"
}

// GetSystemStatsResponse 获取系统统计响应
message GetSystemStatsResponse {
  int64 total_users = 1;          // 总用户数
  int64 active_users = 2;         // 活跃用户数
  int64 total_conversations = 3;  // 总对话数
  int64 total_messages = 4;       // 总消息数
  int64 total_characters = 5;     // 总角色数
  int64 total_tokens_used = 6;    // 总Token消耗
  repeated DailyStat daily_stats = 7;  // 每日统计
}

// HealthCheckRequest 健康检查请求
message HealthCheckRequest {}

// HealthCheckResponse 健康检查响应
message HealthCheckResponse {
  string status = 1;           // 状态: "healthy", "degraded", "unhealthy"
  string version = 2;          // 服务版本
  map<string, string> dependencies = 3;  // 依赖服务状态
}

// AdminUser 管理视角的用户信息
message AdminUser {
  int64 id = 1;                              // 用户ID
  string email = 2;                          // 邮箱
  string username = 3;                       // 用户名
  string status = 4;                         // 状态: "active", "banned", "deleted"
  int64 credit_balance = 5;                  // 积分余额
  google.protobuf.Timestamp created_at = 6;  // 注册时间
  google.protobuf.Timestamp last_active = 7; // 最后活跃时间
  google.protobuf.Timestamp banned_until = 8; // 封禁截止时间
}

// AdminCharacter 管理视角的角色信息
message AdminCharacter {
  int64 id = 1;                              // 角色ID
  string name = 2;                           // 角色名称
  int64 creator_id = 3;                      // 创建者ID
  string status = 4;                         // 状态: "pending", "approved", "rejected"
  bool is_official = 5;                      // 是否官方
  int64 usage_count = 6;                     // 使用次数
  google.protobuf.Timestamp created_at = 7;  // 创建时间
}

// DailyStat 每日统计
message DailyStat {
  string date = 1;          // 日期 (YYYY-MM-DD)
  int64 new_users = 2;      // 新增用户
  int64 active_users = 3;   // 活跃用户
  int64 messages = 4;       // 消息数
  int64 tokens_used = 5;    // Token消耗
}

// ============================================
// 积分管理消息定义 (T231)
// ============================================

// GetCreditFormula

message GetCreditFormulaRequest {}

message GetCreditFormulaResponse {
  CreditFormula formula = 1;
}

message CreditFormula {
  double base_rate = 1;                       // 基础转换率: 1 USD = X 积分
  string currency = 2;                        // 货币单位 (USD)
  map<string, double> model_multipliers = 3;  // 模型成本倍率
  double platform_margin = 4;                 // 平台利润率
  string updated_by = 5;                      // 最后更新者
  google.protobuf.Timestamp updated_at = 6;   // 更新时间
}

// UpdateCreditFormula

message UpdateCreditFormulaRequest {
  double base_rate = 1;                       // 基础转换率
  map<string, double> model_multipliers = 2;  // 模型成本倍率
  double platform_margin = 3;                 // 平台利润率
}

message UpdateCreditFormulaResponse {
  bool success = 1;
  CreditFormula formula = 2;
}

// ListAdminCreditPackages

message ListAdminCreditPackagesRequest {
  bool include_inactive = 1;  // 包含下架套餐
}

message ListAdminCreditPackagesResponse {
  repeated AdminCreditPackage packages = 1;
}

message AdminCreditPackage {
  int64 id = 1;
  string name = 2;
  string description = 3;
  double credits = 4;
  double price_cny = 5;
  double bonus_credits = 6;
  bool is_active = 7;
  int32 sort_order = 8;
  int64 purchase_count = 9;                   // 购买次数统计
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// CreateCreditPackage

message CreateCreditPackageRequest {
  string name = 1;
  string description = 2;
  double credits = 3;
  double price_cny = 4;
  double bonus_credits = 5;
  int32 sort_order = 6;
}

message CreateCreditPackageResponse {
  bool success = 1;
  AdminCreditPackage package = 2;
}

// UpdateCreditPackage

message UpdateCreditPackageRequest {
  int64 package_id = 1;
  string name = 2;
  string description = 3;
  double credits = 4;
  double price_cny = 5;
  double bonus_credits = 6;
  bool is_active = 7;
  int32 sort_order = 8;
}

message UpdateCreditPackageResponse {
  bool success = 1;
  AdminCreditPackage package = 2;
}

// DeleteCreditPackage

message DeleteCreditPackageRequest {
  int64 package_id = 1;
}

message DeleteCreditPackageResponse {
  bool success = 1;
}

// AdjustUserCredits

message AdjustUserCreditsRequest {
  int64 user_id = 1;
  double amount = 2;          // 正数为增加，负数为减少
  string reason = 3;          // 调整原因
}

message AdjustUserCreditsResponse {
  bool success = 1;
  double balance_after = 2;   // 调整后余额
}

// GetBillingStats

message GetBillingStatsRequest {
  string period = 1;          // day, week, month
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
}

message GetBillingStatsResponse {
  double total_revenue = 1;           // 总收入 (CNY)
  double total_credits_sold = 2;      // 总售出积分
  double total_credits_consumed = 3;  // 总消耗积分
  int64 total_orders = 4;             // 总订单数
  int64 paying_users = 5;             // 付费用户数
  double avg_order_amount = 6;        // 平均订单金额
  repeated BillingDailyStat daily_stats = 7;
}

message BillingDailyStat {
  string date = 1;
  double revenue = 2;
  double credits_sold = 3;
  double credits_consumed = 4;
  int64 orders = 5;
  int64 new_paying_users = 6;
}
