syntax = "proto3";

package billing.v1;

option go_package = "github.com/myy-chat/backend/golang/api/billing/v1;v1";
option java_multiple_files = true;
option java_package = "billing.v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// ============================================
// Billing Service Definition
// ============================================

service BillingService {
  // GetBalance 获取用户积分余额
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/balance"
    };
  }

  // GetTransactions 获取交易记录
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/transactions"
    };
  }

  // ListCreditPackages 获取积分套餐列表
  rpc ListCreditPackages(ListCreditPackagesRequest) returns (ListCreditPackagesResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/packages"
    };
  }

  // CreateOrder 创建充值订单
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = {
      post: "/api/v1/billing/orders"
      body: "*"
    };
  }

  // GetOrder 查询订单状态
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = {
      get: "/api/v1/billing/orders/{order_id}"
    };
  }

  // SyncLLMCost 同步 LLM 调用成本 (内部 RPC，由 LLM Agent Service 调用)
  rpc SyncLLMCost(SyncLLMCostRequest) returns (SyncLLMCostResponse);

  // DeductCredits 扣除积分 (内部 RPC)
  rpc DeductCredits(DeductCreditsRequest) returns (DeductCreditsResponse);

  // AddCredits 添加积分 (内部 RPC，用于充值回调)
  rpc AddCredits(AddCreditsRequest) returns (AddCreditsResponse);
}

// ============================================
// Request/Response Messages
// ============================================

// GetBalance

message GetBalanceRequest {
  int64 user_id = 1;  // 用户ID (从 JWT 获取，可选传入)
}

message GetBalanceResponse {
  int64 user_id = 1;
  double balance = 2;           // 当前余额
  double total_charged = 3;     // 累计充值
  double total_consumed = 4;    // 累计消费
  google.protobuf.Timestamp updated_at = 5;
}

// GetTransactions

message GetTransactionsRequest {
  int64 user_id = 1;
  int32 page = 2;           // 页码，从1开始
  int32 page_size = 3;      // 每页数量，默认20，最大100
  string type = 4;          // 交易类型过滤: charge, consume, refund, bonus
  google.protobuf.Timestamp start_time = 5;  // 开始时间
  google.protobuf.Timestamp end_time = 6;    // 结束时间
}

message GetTransactionsResponse {
  repeated Transaction transactions = 1;
  int32 total = 2;          // 总记录数
  int32 page = 3;
  int32 page_size = 4;
}

message Transaction {
  int64 id = 1;
  int64 user_id = 2;
  string type = 3;              // charge, consume, refund, bonus
  double amount = 4;            // 交易金额 (正数为增加，负数为减少)
  double balance_after = 5;     // 交易后余额
  string description = 6;       // 交易描述
  string reference_type = 7;    // 关联类型: order, llm_call, admin
  int64 reference_id = 8;       // 关联ID
  google.protobuf.Timestamp created_at = 9;
}

// ListCreditPackages

message ListCreditPackagesRequest {
  bool include_inactive = 1;  // 是否包含下架套餐
}

message ListCreditPackagesResponse {
  repeated CreditPackage packages = 1;
}

message CreditPackage {
  int64 id = 1;
  string name = 2;
  string description = 3;
  double credits = 4;           // 积分数量
  double price_cny = 5;         // 价格（人民币）
  double bonus_credits = 6;     // 赠送积分
  bool is_active = 7;
  int32 sort_order = 8;
}

// CreateOrder

message CreateOrderRequest {
  int64 user_id = 1;
  int64 package_id = 2;         // 套餐ID
  string payment_method = 3;    // 支付方式: alipay, wechat
}

message CreateOrderResponse {
  int64 order_id = 1;
  string order_no = 2;          // 订单号
  double amount = 3;            // 支付金额
  string payment_url = 4;       // 支付链接/二维码内容
  string payment_method = 5;
  google.protobuf.Timestamp expire_at = 6;  // 订单过期时间
}

// GetOrder

message GetOrderRequest {
  int64 order_id = 1;
}

message GetOrderResponse {
  int64 order_id = 1;
  string order_no = 2;
  int64 user_id = 3;
  int64 package_id = 4;
  double amount = 5;
  string status = 6;            // pending, paid, cancelled, expired, refunded
  string payment_method = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp paid_at = 9;
}

// SyncLLMCost (T230: 内部 RPC，用于同步 LLM 调用成本)

message SyncLLMCostRequest {
  int64 user_id = 1;                    // 用户ID
  double cost_usd = 2;                  // LLM 调用成本 (USD)
  string model = 3;                     // 模型名称
  int32 input_tokens = 4;               // 输入 token 数
  int32 output_tokens = 5;              // 输出 token 数
  int64 conversation_id = 6;            // 关联的对话ID
  int64 message_id = 7;                 // 关联的消息ID
  string request_id = 8;                // 请求追踪ID
}

message SyncLLMCostResponse {
  bool success = 1;
  double credits_deducted = 2;          // 扣除的积分数量
  double balance_after = 3;             // 扣除后余额
  string error_message = 4;             // 错误信息 (如余额不足)
}

// DeductCredits (内部 RPC)

message DeductCreditsRequest {
  int64 user_id = 1;
  double amount = 2;                    // 扣除积分数量
  string reason = 3;                    // 扣除原因
  string reference_type = 4;            // 关联类型
  int64 reference_id = 5;               // 关联ID
  string idempotency_key = 6;           // 幂等键
}

message DeductCreditsResponse {
  bool success = 1;
  double balance_after = 2;
  string error_message = 3;
}

// AddCredits (内部 RPC，充值回调)

message AddCreditsRequest {
  int64 user_id = 1;
  double amount = 2;                    // 增加积分数量
  string reason = 3;                    // 原因: charge, bonus, refund, admin
  string reference_type = 4;            // 关联类型
  int64 reference_id = 5;               // 关联ID (如订单ID)
  string idempotency_key = 6;           // 幂等键
}

message AddCreditsResponse {
  bool success = 1;
  double balance_after = 2;
  string error_message = 3;
}
