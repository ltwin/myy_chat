# Python项目配置 - MyY Chat AI角色对话平台
# 包含ruff, black, mypy, pytest配置

[project]
name = "myy-chat"
version = "0.1.0"
description = "AI角色对话平台 - 企业级微服务架构"
requires-python = ">=3.11"

[tool.ruff]
# Ruff 代码检查配置
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "E501",   # Line too long (已由 black 处理)
    "B008",   # Do not perform function calls in argument defaults
    "S101",   # Use of assert detected (允许在测试中使用)
    "ARG002", # Unused method argument (装饰器模式常见)
    "N805",   # First argument of a method should be named `self` (pydantic 模型)
    "RUF012", # Mutable class attributes (pydantic 模型)
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*_pb2.py",
    "*_pb2_grpc.py",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # 允许未使用的导入
"**/tests/**" = ["S101", "ARG001", "ARG002"]  # 测试文件允许 assert

[tool.black]
# Black 代码格式化配置
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | .*_pb2\.py
  | .*_pb2_grpc\.py
)/
'''

[tool.mypy]
# MyPy 类型检查配置
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # 装饰器常见问题
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# 第三方库允许缺少类型
[[tool.mypy.overrides]]
module = [
    "grpc.*",
    "litellm.*",
    "langchain.*",
    "langgraph.*",
    "transformers.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Pytest 测试配置
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=70",  # 宪法要求: 测试覆盖率 ≥70%
    "--tb=short",
    "--asyncio-mode=auto",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# Coverage 配置
source = ["."]
omit = [
    "*/tests/*",
    "*_pb2.py",
    "*_pb2_grpc.py",
    "*/venv/*",
    "*/.venv/*",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
# Coverage 报告配置
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
