apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/myy_chat.git
    targetRevision: main
    path: deployments/k8s/helm/service
    helm:
      releaseName: user
      valueFiles:
        - values/dev/user.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: myy-chat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

